name: Feature request
description: Suggest an idea for Elbows Up
labels: [ "feature request", "needs triage" ]
body:
  - type: markdown
    attributes:
      value: |
        ## Hi there 👋
        Thanks for helping improve Elbows Up!

        Ideas about caller ID names or call blocking belong here. Anything else (dialer, contacts,
        call history, translations) belongs to the upstream project, where everyone can use it:
        [Fossify Phone feature requests](https://github.com/FossifyOrg/Phone/issues).

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "This request is about caller ID names or call blocking, or something that only exists in Elbows Up."
          required: true
        - label: "I made sure that there are **no existing issues** - [open](https://github.com/ccormier/elbowsup-phone/issues) or [closed](https://github.com/ccormier/elbowsup-phone/issues?q=is%3Aissue+is%3Aclosed) - to which I could contribute my information."
          required: true
        - label: "**I have taken the time to fill in all the required details. I understand that the request will be dismissed otherwise.**"
          required: true
        - label: "This issue contains only one feature request."
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: |
        Explain how you want the app's look or behavior to change to suit your needs.
    validations:
      required: true

  - type: textarea
    id: why-is-the-feature-requested
    attributes:
      label: Why do you want this feature?
      description: |
        Describe any problem or limitation you come across while using the app which would be solved by this feature.
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Any other information you'd like to include, for instance sketches, mockups, pictures of rabbits, etc.
